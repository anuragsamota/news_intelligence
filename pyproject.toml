[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence"
version = "0.1.0"
description = "Multi-source news intelligence: an agentic RAG pipeline on LangGraph + Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
    "numpy>=1.26",
    "langchain-ollama>=1.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
news-intelligence = "news_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
